<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- átomo central -->
  <g transform="translate(640,360)">
    <!-- núcleo -->
    <circle cx="0" cy="0" r="30" fill="#f4c542"/>
    <circle cx="-10" cy="-5" r="10" fill="#d63b3b"/>
    <circle cx="10" cy="8" r="8" fill="#ffffff"/>
    <!-- órbitas -->
    <ellipse cx="0" cy="0" rx="120" ry="45" fill="none" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="120" ry="45" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="120" ry="45" fill="none" stroke="#ffffff" stroke-width="3" transform="rotate(-60)"/>
    <!-- electrones -->
    <circle cx="120" cy="0" r="8" fill="#039ed6"/>
    <circle cx="-60" cy="39" r="8" fill="#039ed6"/>
    <circle cx="60" cy="-90" r="8" fill="#039ed6"/>
  </g>
  <!-- vaso de precipitado -->
  <g transform="translate(220,420)">
    <path d="M-50,0 L-50,120 Q-50,140 -30,140 L30,140 Q50,140 50,120 L50,0 Z" fill="#ffffff" opacity="0.2" stroke="#ffffff" stroke-width="3"/>
    <!-- líquido -->
    <path d="M-46,60 L-46,118 Q-46,135 -30,135 L30,135 Q46,135 46,118 L46,60 Z" fill="#039ed6" opacity="0.7"/>
    <!-- burbujas -->
    <circle cx="-15" cy="80" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="10" cy="100" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="20" cy="75" r="3" fill="#ffffff" opacity="0.6"/>
    <!-- marca de medición -->
    <g stroke="#ffffff" stroke-width="1.5">
      <line x1="-50" y1="30" x2="-40" y2="30"/><line x1="-50" y1="60" x2="-40" y2="60"/>
      <line x1="-50" y1="90" x2="-40" y2="90"/><line x1="-50" y1="120" x2="-40" y2="120"/>
    </g>
  </g>
  <!-- fórmulas flotando -->
  <g fill="#f4c542" font-family="Georgia,serif" font-size="28" font-weight="700">
    <text x="960" y="240">H₂O</text>
    <text x="1020" y="340" font-size="22">E=mc²</text>
    <text x="940" y="440" font-size="24">F=ma</text>
    <text x="1040" y="520" font-size="20">πr²</text>
  </g>
  <!-- ADN -->
  <g transform="translate(1080,580)" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M-30,-60 Q0,-30 30,0 Q0,30 -30,60"/>
    <path d="M30,-60 Q0,-30 -30,0 Q0,30 30,60"/>
    <line x1="-20" y1="-45" x2="20" y2="-45" stroke="#f4c542"/>
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#f4c542"/>
    <line x1="-25" y1="15" x2="25" y2="15" stroke="#f4c542"/>
    <line x1="-20" y1="45" x2="20" y2="45" stroke="#f4c542"/>
  </g>
  <!-- pizarra con ecuación -->
  <g transform="translate(100,200)">
    <rect x="0" y="0" width="200" height="130" rx="6" fill="#026892" stroke="#f4c542" stroke-width="4"/>
    <text x="100" y="55" font-family="monospace" font-size="22" fill="#f4c542" text-anchor="middle">a² + b² = c²</text>
    <text x="100" y="95" font-family="monospace" font-size="16" fill="#5cb8e0" text-anchor="middle">→ pensar</text>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Didáctica</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
