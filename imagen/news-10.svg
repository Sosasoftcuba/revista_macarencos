<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- hoja de evaluación -->
  <g transform="translate(440,200) rotate(-5)">
    <rect x="0" y="0" width="400" height="320" rx="6" fill="#ffffff"/>
    <!-- cabecera -->
    <rect x="0" y="0" width="400" height="50" rx="6" fill="#039ed6"/>
    <text x="200" y="32" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Evaluación</text>
    <!-- ítems con checks -->
    <g font-family="Arial" font-size="18" fill="#026892">
      <rect x="30" y="80" width="24" height="24" rx="4" fill="none" stroke="#026892" stroke-width="2"/>
      <path d="M34,92 L40,98 L50,84" fill="none" stroke="#f4c542" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="98">Comprensión lectora</text>
      <rect x="30" y="130" width="24" height="24" rx="4" fill="none" stroke="#026892" stroke-width="2"/>
      <path d="M34,142 L40,148 L50,134" fill="none" stroke="#f4c542" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="148">Resolución de problemas</text>
      <rect x="30" y="180" width="24" height="24" rx="4" fill="none" stroke="#026892" stroke-width="2"/>
      <path d="M34,192 L40,198 L50,184" fill="none" stroke="#f4c542" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="198">Expresión escrita</text>
      <rect x="30" y="230" width="24" height="24" rx="4" fill="none" stroke="#026892" stroke-width="2"/>
      <text x="70" y="248">Trabajo en equipo</text>
    </g>
    <!-- nota final -->
    <rect x="250" y="270" width="120" height="35" rx="4" fill="#f4c542"/>
    <text x="310" y="294" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#026892" text-anchor="middle">A — 95</text>
  </g>
  <!-- lápiz grande -->
  <g transform="translate(880,180) rotate(45)">
    <!-- cuerpo -->
    <rect x="0" y="0" width="50" height="280" fill="#f4c542"/>
    <!-- goma -->
    <rect x="0" y="-40" width="50" height="40" fill="#d63b3b"/>
    <rect x="0" y="-45" width="50" height="8" fill="#026892"/>
    <!-- punta -->
    <polygon points="0,280 50,280 25,340" fill="#f4c5a0"/>
    <polygon points="10,310 40,310 25,340" fill="#026892"/>
    <!-- banda -->
    <rect x="0" y="50" width="50" height="15" fill="#026892"/>
  </g>
  <!-- estrella A+ -->
  <g transform="translate(220,400)">
    <polygon points="0,-50 15,-15 50,-15 22,8 32,42 0,22 -32,42 -22,8 -50,-15 -15,-15" fill="#f4c542"/>
    <text x="0" y="10" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#026892" text-anchor="middle">A+</text>
  </g>
  <!-- círculo de progreso -->
  <g transform="translate(220,200)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3"/>
    <path d="M0,-55 A55,55 0 1,1 -50,25" fill="none" stroke="#f4c542" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="8" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">85%</text>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Pedagogía</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
