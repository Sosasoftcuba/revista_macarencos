<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- escenario -->
  <rect x="0" y="520" width="1280" height="200" fill="#026892" opacity="0.6"/>
  <rect x="200" y="500" width="880" height="30" fill="#f4c542" opacity="0.8"/>
  <!-- tres graduados -->
  <g transform="translate(440,380)">
    <path d="M-40,140 L-45,30 Q-45,0 -25,-10 L25,-10 Q45,0 45,30 L40,140 Z" fill="#ffffff"/>
    <circle cx="0" cy="-30" r="25" fill="#f4c5a0"/>
    <!-- birrete -->
    <rect x="-25" y="-65" width="50" height="10" fill="#026892"/>
    <polygon points="-30,-60 30,-60 0,-85" fill="#026892"/>
    <line x1="0" y1="-72" x2="20" y2="-55" stroke="#f4c542" stroke-width="3"/>
    <circle cx="22" cy="-53" r="5" fill="#f4c542"/>
    <!-- diploma en mano -->
    <rect x="30" y="60" width="30" height="40" rx="3" fill="#f4c542" stroke="#026892" stroke-width="2"/>
    <line x1="45" y1="60" x2="45" y2="100" stroke="#d63b3b" stroke-width="6"/>
  </g>
  <g transform="translate(640,360)">
    <path d="M-40,160 L-45,30 Q-45,0 -25,-10 L25,-10 Q45,0 45,30 L40,160 Z" fill="#ffffff"/>
    <circle cx="0" cy="-30" r="28" fill="#e8b890"/>
    <rect x="-28" y="-65" width="56" height="10" fill="#026892"/>
    <polygon points="-33,-60 33,-60 0,-88" fill="#026892"/>
    <line x1="0" y1="-74" x2="22" y2="-55" stroke="#f4c542" stroke-width="3"/>
    <circle cx="24" cy="-53" r="5" fill="#f4c542"/>
  </g>
  <g transform="translate(840,380)">
    <path d="M-40,140 L-45,30 Q-45,0 -25,-10 L25,-10 Q45,0 45,30 L40,140 Z" fill="#ffffff"/>
    <circle cx="0" cy="-30" r="25" fill="#f4c5a0"/>
    <rect x="-25" y="-65" width="50" height="10" fill="#026892"/>
    <polygon points="-30,-60 30,-60 0,-85" fill="#026892"/>
    <line x1="0" y1="-72" x2="-20" y2="-55" stroke="#f4c542" stroke-width="3"/>
    <circle cx="-22" cy="-53" r="5" fill="#f4c542"/>
    <rect x="-60" y="60" width="30" height="40" rx="3" fill="#f4c542" stroke="#026892" stroke-width="2"/>
    <line x1="-45" y1="60" x2="-45" y2="100" stroke="#d63b3b" stroke-width="6"/>
  </g>
  <!-- libros en el suelo -->
  <g transform="translate(180,620)">
    <rect x="0" y="0" width="120" height="20" rx="2" fill="#5cb8e0"/>
    <rect x="10" y="-20" width="100" height="20" rx="2" fill="#ffffff"/>
    <rect x="20" y="-40" width="80" height="20" rx="2" fill="#f4c542"/>
  </g>
  <g transform="translate(980,620)">
    <rect x="0" y="0" width="120" height="20" rx="2" fill="#f4c542"/>
    <rect x="10" y="-20" width="100" height="20" rx="2" fill="#ffffff"/>
    <rect x="20" y="-40" width="80" height="20" rx="2" fill="#5cb8e0"/>
  </g>
  <!-- confeti -->
  <g fill="#f4c542">
    <rect x="200" y="120" width="8" height="8" transform="rotate(20 204 124)"/>
    <rect x="400" y="100" width="6" height="6" transform="rotate(45 403 103)"/>
    <rect x="600" y="140" width="8" height="8" transform="rotate(30 604 144)"/>
    <rect x="800" y="110" width="6" height="6" transform="rotate(60 803 113)"/>
    <rect x="1000" y="130" width="8" height="8" transform="rotate(15 1004 134)"/>
  </g>
  <g fill="#ffffff">
    <rect x="300" y="180" width="6" height="6" transform="rotate(40 303 183)"/>
    <rect x="700" y="170" width="8" height="8" transform="rotate(25 704 174)"/>
    <rect x="900" y="190" width="6" height="6" transform="rotate(50 903 193)"/>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Educación de adultos</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
