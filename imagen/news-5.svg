<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- escalera de libros ascendente -->
  <g transform="translate(640,560)">
    <!-- escalón 1 -->
    <g transform="translate(-220,0)">
      <rect x="-60" y="-30" width="120" height="30" rx="2" fill="#f4c542"/>
      <rect x="-60" y="-30" width="120" height="6" fill="#026892"/>
    </g>
    <!-- escalón 2 -->
    <g transform="translate(-110,-80)">
      <rect x="-60" y="-30" width="120" height="30" rx="2" fill="#ffffff"/>
      <rect x="-60" y="-30" width="120" height="6" fill="#026892"/>
    </g>
    <!-- escalón 3 -->
    <g transform="translate(0,-160)">
      <rect x="-60" y="-30" width="120" height="30" rx="2" fill="#f4c542"/>
      <rect x="-60" y="-30" width="120" height="6" fill="#026892"/>
    </g>
    <!-- escalón 4 -->
    <g transform="translate(110,-240)">
      <rect x="-60" y="-30" width="120" height="30" rx="2" fill="#ffffff"/>
      <rect x="-60" y="-30" width="120" height="6" fill="#026892"/>
    </g>
    <!-- escalón 5 (cima) -->
    <g transform="translate(220,-320)">
      <rect x="-60" y="-30" width="120" height="30" rx="2" fill="#f4c542"/>
      <rect x="-60" y="-30" width="120" height="6" fill="#026892"/>
    </g>
  </g>
  <!-- silueta docente en la cima -->
  <g transform="translate(860,180)" fill="#ffffff">
    <circle cx="0" cy="0" r="20"/>
    <path d="M-25,25 L-30,90 L30,90 L25,25 Z"/>
    <!-- brazo levantado -->
    <rect x="20" y="30" width="10" height="40" rx="4" transform="rotate(-30 25 50)"/>
  </g>
  <!-- estrella en lo alto (meta alcanzada) -->
  <g transform="translate(860,120)" fill="#f4c542">
    <polygon points="0,-30 9,-9 30,-9 13,5 19,25 0,12 -19,25 -13,5 -30,-9 -9,-9"/>
  </g>
  <!-- flecha de crecimiento -->
  <g transform="translate(160,500)" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.5">
    <path d="M0,150 Q40,100 80,80 T160,20" stroke-linecap="round"/>
    <polygon points="160,20 145,30 155,15" fill="#ffffff" stroke="none"/>
  </g>
  <!-- libros apilados abajo a la izquierda -->
  <g transform="translate(120,580)">
    <rect x="0" y="0" width="140" height="22" rx="2" fill="#5cb8e0"/>
    <rect x="10" y="-22" width="120" height="22" rx="2" fill="#ffffff"/>
    <rect x="20" y="-44" width="100" height="22" rx="2" fill="#f4c542"/>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Formación</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
