<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- ondas wifi de fondo -->
  <g fill="none" stroke="#5cb8e0" stroke-width="3" opacity="0.25">
    <circle cx="640" cy="360" r="280"/>
    <circle cx="640" cy="360" r="200"/>
    <circle cx="640" cy="360" r="120"/>
  </g>
  <!-- laptop central -->
  <g transform="translate(640,420)">
    <!-- pantalla -->
    <rect x="-180" y="-140" width="360" height="220" rx="10" fill="#026892"/>
    <rect x="-165" y="-125" width="330" height="190" rx="4" fill="#ffffff"/>
    <!-- contenido pantalla: aula virtual -->
    <rect x="-150" y="-110" width="300" height="30" rx="3" fill="#e6f5fb"/>
    <circle cx="-135" cy="-95" r="6" fill="#d63b3b"/>
    <circle cx="-118" cy="-95" r="6" fill="#f4c542"/>
    <circle cx="-101" cy="-95" r="6" fill="#039ed6"/>
    <!-- avatar docente -->
    <circle cx="-110" cy="-50" r="20" fill="#039ed6"/>
    <rect x="-130" y="-30" width="40" height="20" rx="3" fill="#5cb8e0"/>
    <!-- texto/lecciones -->
    <g fill="#039ed6">
      <rect x="-75" y="-65" width="120" height="6" rx="2"/>
      <rect x="-75" y="-50" width="100" height="6" rx="2"/>
      <rect x="-75" y="-35" width="80" height="6" rx="2"/>
    </g>
    <!-- botón play -->
    <circle cx="80" cy="-50" r="18" fill="#f4c542"/>
    <polygon points="74,-58 74,-42 92,-50" fill="#026892"/>
    <!-- base laptop -->
    <path d="M-200,80 L200,80 L220,110 L-220,110 Z" fill="#026892"/>
    <rect x="-30" y="80" width="60" height="6" rx="3" fill="#039ed6"/>
  </g>
  <!-- mundo/red global -->
  <g transform="translate(280,260)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="30" ry="80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="2"/>
    <!-- puntos de conexión -->
    <circle cx="-40" cy="-30" r="5" fill="#f4c542"/>
    <circle cx="40" cy="20" r="5" fill="#f4c542"/>
    <circle cx="20" cy="-50" r="5" fill="#f4c542"/>
  </g>
  <!-- teléfono móvil -->
  <g transform="translate(1000,250) rotate(15)">
    <rect x="-40" y="-80" width="80" height="160" rx="12" fill="#ffffff"/>
    <rect x="-32" y="-68" width="64" height="120" rx="3" fill="#026892"/>
    <circle cx="0" cy="65" r="6" fill="#026892"/>
    <!-- contenido -->
    <rect x="-25" y="-55" width="50" height="30" rx="3" fill="#f4c542"/>
    <g fill="#5cb8e0">
      <rect x="-25" y="-15" width="50" height="5" rx="2"/>
      <rect x="-25" y="-5" width="40" height="5" rx="2"/>
      <rect x="-25" y="5" width="45" height="5" rx="2"/>
    </g>
  </g>
  <!-- auriculares -->
  <g transform="translate(1020,500)" stroke="#f4c542" stroke-width="5" fill="none">
    <path d="M-40,0 Q-40,-50 0,-50 Q40,-50 40,0"/>
    <rect x="-50" y="-5" width="20" height="35" rx="6" fill="#f4c542"/>
    <rect x="30" y="-5" width="20" height="35" rx="6" fill="#f4c542"/>
  </g>
  <!-- señal wifi arriba -->
  <g transform="translate(640,140)" fill="#f4c542">
    <path d="M-40,0 Q0,-30 40,0 L35,5 Q0,-22 -35,5 Z"/>
    <path d="M-25,15 Q0,-5 25,15 L22,20 Q0,2 -22,20 Z"/>
    <circle cx="0" cy="30" r="5"/>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Tecnología educativa</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
