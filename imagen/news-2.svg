<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- suelo del taller -->
  <rect x="0" y="520" width="1280" height="200" fill="#026892" opacity="0.5"/>
  <!-- banco de trabajo -->
  <rect x="120" y="440" width="1040" height="40" fill="#f4c542" opacity="0.85"/>
  <rect x="120" y="480" width="40" height="120" fill="#026892"/>
  <rect x="1120" y="480" width="40" height="120" fill="#026892"/>
  <!-- engranaje grande -->
  <g transform="translate(280,280)">
    <g fill="#ffffff">
      <circle cx="0" cy="0" r="90"/>
      <rect x="-12" y="-110" width="24" height="30"/><rect x="-12" y="80" width="24" height="30"/>
      <rect x="-110" y="-12" width="30" height="24"/><rect x="80" y="-12" width="30" height="24"/>
      <g transform="rotate(45)">
        <rect x="-12" y="-110" width="24" height="30"/><rect x="-12" y="80" width="24" height="30"/>
        <rect x="-110" y="-12" width="30" height="24"/><rect x="80" y="-12" width="30" height="24"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="40" fill="#039ed6"/>
    <circle cx="0" cy="0" r="20" fill="#026892"/>
  </g>
  <!-- libro abierto -->
  <g transform="translate(640,300)">
    <path d="M-100,0 L0,-20 L100,0 L100,80 L0,60 L-100,80 Z" fill="#ffffff"/>
    <line x1="0" y1="-20" x2="0" y2="60" stroke="#026892" stroke-width="2"/>
    <g stroke="#5cb8e0" stroke-width="1.5" opacity="0.7">
      <line x1="-80" y1="15" x2="-20" y2="5"/><line x1="-80" y1="30" x2="-20" y2="20"/>
      <line x1="-80" y1="45" x2="-20" y2="35"/>
      <line x1="20" y1="5" x2="80" y2="15"/><line x1="20" y1="20" x2="80" y2="30"/>
      <line x1="20" y1="35" x2="80" y2="45"/>
    </g>
  </g>
  <!-- llave inglesa -->
  <g transform="translate(960,260) rotate(-30)">
    <rect x="-15" y="-100" width="30" height="160" rx="6" fill="#f4c542"/>
    <path d="M-30,-130 Q-30,-160 0,-160 Q30,-160 30,-130 L30,-100 L15,-95 L15,-115 Q15,-130 0,-130 Q-15,-130 -15,-115 L-15,-95 L-30,-100 Z" fill="#f4c542"/>
  </g>
  <!-- tornillo -->
  <g transform="translate(1080,380)">
    <polygon points="-20,-15 20,-15 25,0 20,15 -20,15 -25,0" fill="#ffffff"/>
    <rect x="-8" y="15" width="16" height="50" fill="#ffffff"/>
  </g>
  <!-- chispas/destellos -->
  <g fill="#f4c542">
    <circle cx="420" cy="180" r="3"/><circle cx="500" cy="140" r="2"/><circle cx="560" cy="200" r="2.5"/>
    <circle cx="760" cy="160" r="2"/><circle cx="840" cy="220" r="3"/>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Práctica docente</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
