  <text x="520" y="210" font-family="Arial" font-size="15" fill="#f5f1e8">▸ App 24/7</text><text x="520" y="255" font-family="Arial" font-size="15" fill="#f5f1e8">▸ Onboarding online</text><text x="520" y="300" font-family="Arial" font-size="15" fill="#f5f1e8">▸ Automatización</text><text x="520" y="345" font-family="Arial" font-size="15" fill="#f5f1e8">▸ Costos menores</text>
