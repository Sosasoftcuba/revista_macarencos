<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- triángulo central (triada) -->
  <polygon points="640,180 460,500 820,500" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4"/>
  <!-- tres círculos en los vértices -->
  <g transform="translate(640,180)">
    <circle cx="0" cy="0" r="70" fill="#5cb8e0" opacity="0.8"/>
    <!-- icono escuela (edificio) -->
    <g fill="#ffffff">
      <rect x="-30" y="-15" width="60" height="35"/>
      <polygon points="-35,-15 0,-35 35,-15"/>
      <rect x="-8" y="0" width="16" height="20" fill="#026892"/>
      <rect x="-25" y="-5" width="8" height="8" fill="#026892"/>
      <rect x="17" y="-5" width="8" height="8" fill="#026892"/>
    </g>
    <text x="0" y="50" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Escuela</text>
  </g>
  <g transform="translate(460,500)">
    <circle cx="0" cy="0" r="70" fill="#f4c542" opacity="0.85"/>
    <!-- icono familia (personas) -->
    <g fill="#026892">
      <circle cx="-15" cy="-15" r="10"/>
      <circle cx="10" cy="-15" r="12"/>
      <circle cx="0" cy="15" r="8"/>
      <rect x="-25" y="-5" width="14" height="25" rx="3"/>
      <rect x="0" y="-3" width="16" height="23" rx="3"/>
      <rect x="-8" y="20" width="12" height="18" rx="3"/>
    </g>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Familia</text>
  </g>
  <g transform="translate(820,500)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.9"/>
    <!-- icono comunidad (casas) -->
    <g fill="#026892">
      <rect x="-30" y="-5" width="22" height="25"/>
      <polygon points="-32,-5 -19,-20 -6,-5"/>
      <rect x="8" y="-5" width="22" height="25"/>
      <polygon points="6,-5 19,-20 32,-5"/>
      <rect x="-10" y="5" width="20" height="20"/>
    </g>
    <text x="0" y="55" font-family="Arial" font-size="14" fill="#026892" text-anchor="middle" font-weight="700">Comunidad</text>
  </g>
  <!-- corazón central (unión) -->
  <g transform="translate(640,400)">
    <path d="M0,25 C-25,5 -25,-15 -12,-15 C-4,-15 0,-8 0,-3 C0,-8 4,-15 12,-15 C25,-15 25,5 0,25 Z" fill="#d63b3b"/>
  </g>
  <!-- manos entrelazadas en los lados -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3">
    <path d="M640,250 L490,440" stroke-dasharray="8,8"/>
    <path d="M640,250 L790,440" stroke-dasharray="8,8"/>
    <path d="M510,490 L770,490" stroke-dasharray="8,8"/>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Sociedad</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
