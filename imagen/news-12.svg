<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- librero antiguo -->
  <g transform="translate(140,180)">
    <rect x="0" y="0" width="280" height="400" rx="4" fill="#026892"/>
    <!-- estantes -->
    <rect x="15" y="80" width="250" height="6" fill="#f4c542"/>
    <rect x="15" y="200" width="250" height="6" fill="#f4c542"/>
    <rect x="15" y="320" width="250" height="6" fill="#f4c542"/>
    <!-- libros en estantes -->
    <g>
      <rect x="20" y="20" width="18" height="55" fill="#ffffff"/>
      <rect x="40" y="30" width="18" height="45" fill="#f4c542"/>
      <rect x="60" y="15" width="18" height="60" fill="#5cb8e0"/>
      <rect x="80" y="25" width="22" height="50" fill="#ffffff"/>
      <rect x="104" y="20" width="18" height="55" fill="#f4c542"/>
      <rect x="124" y="30" width="18" height="45" fill="#039ed6"/>
      <rect x="144" y="15" width="22" height="60" fill="#ffffff"/>
      <rect x="170" y="25" width="18" height="50" fill="#f4c542"/>
      <rect x="190" y="20" width="18" height="55" fill="#5cb8e0"/>
      <rect x="210" y="30" width="20" height="45" fill="#ffffff"/>
      <rect x="234" y="20" width="18" height="55" fill="#f4c542"/>
    </g>
    <g transform="translate(0,120)">
      <rect x="20" y="20" width="18" height="55" fill="#5cb8e0"/>
      <rect x="40" y="30" width="18" height="45" fill="#ffffff"/>
      <rect x="60" y="15" width="22" height="60" fill="#f4c542"/>
      <rect x="86" y="25" width="18" height="50" fill="#ffffff"/>
      <rect x="106" y="20" width="18" height="55" fill="#039ed6"/>
      <rect x="126" y="30" width="20" height="45" fill="#f4c542"/>
      <rect x="150" y="15" width="18" height="60" fill="#ffffff"/>
      <rect x="170" y="25" width="18" height="50" fill="#5cb8e0"/>
      <rect x="190" y="20" width="22" height="55" fill="#f4c542"/>
      <rect x="216" y="30" width="18" height="45" fill="#ffffff"/>
    </g>
    <g transform="translate(0,240)">
      <rect x="20" y="20" width="18" height="55" fill="#f4c542"/>
      <rect x="40" y="30" width="22" height="45" fill="#ffffff"/>
      <rect x="66" y="15" width="18" height="60" fill="#5cb8e0"/>
      <rect x="86" y="25" width="18" height="50" fill="#f4c542"/>
      <rect x="106" y="20" width="20" height="55" fill="#ffffff"/>
      <rect x="130" y="30" width="18" height="45" fill="#039ed6"/>
      <rect x="150" y="15" width="22" height="60" fill="#f4c542"/>
      <rect x="176" y="25" width="18" height="50" fill="#ffffff"/>
      <rect x="196" y="20" width="18" height="55" fill="#5cb8e0"/>
      <rect x="216" y="30" width="20" height="45" fill="#f4c542"/>
    </g>
  </g>
  <!-- retratos enmarcados (siluetas) -->
  <g transform="translate(640,200)">
    <!-- marco 1: Luz y Caballero -->
    <g transform="translate(-130,0)">
      <rect x="-70" y="-90" width="140" height="200" rx="4" fill="#f4c542"/>
      <rect x="-60" y="-80" width="120" height="160" rx="2" fill="#ffffff"/>
      <!-- silueta busto -->
      <circle cx="0" cy="-30" r="28" fill="#026892"/>
      <path d="M-45,40 Q-45,10 0,10 Q45,10 45,40 L45,80 L-45,80 Z" fill="#026892"/>
      <!-- cuello alto época -->
      <rect x="-8" y="-10" width="16" height="20" fill="#ffffff"/>
      <text x="0" y="105" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#026892" text-anchor="middle">Luz y Caballero</text>
      <text x="0" y="122" font-family="Arial" font-size="11" fill="#026892" text-anchor="middle" opacity="0.7">1800</text>
    </g>
    <!-- marco 2: Varona -->
    <g transform="translate(130,0)">
      <rect x="-70" y="-90" width="140" height="200" rx="4" fill="#5cb8e0"/>
      <rect x="-60" y="-80" width="120" height="160" rx="2" fill="#ffffff"/>
      <circle cx="0" cy="-30" r="28" fill="#026892"/>
      <path d="M-45,40 Q-45,10 0,10 Q45,10 45,40 L45,80 L-45,80 Z" fill="#026892"/>
      <!-- bigote -->
      <path d="M-15,-25 Q-5,-20 0,-25 Q5,-20 15,-25" fill="none" stroke="#026892" stroke-width="3"/>
      <text x="0" y="105" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#026892" text-anchor="middle">Varona</text>
      <text x="0" y="122" font-family="Arial" font-size="11" fill="#026892" text-anchor="middle" opacity="0.7">1848</text>
    </g>
  </g>
  <!-- pluma y tintero -->
  <g transform="translate(960,440) rotate(20)">
    <rect x="0" y="0" width="10" height="120" fill="#f4c542"/>
    <polygon points="0,120 10,120 5,150" fill="#026892"/>
    <rect x="-2" y="-20" width="14" height="20" fill="#026892"/>
  </g>
  <g transform="translate(1060,540)">
    <ellipse cx="0" cy="20" rx="35" ry="12" fill="#026892"/>
    <rect x="-30" y="-15" width="60" height="35" rx="6" fill="#ffffff"/>
    <ellipse cx="0" cy="-15" rx="15" ry="5" fill="#026892"/>
  </g>
  <!-- pergamino con cita -->
  <g transform="translate(640,560)">
    <path d="M-180,0 Q-180,-20 -160,-25 L160,-25 Q180,-20 180,0 L180,50 Q180,70 160,75 L-160,75 Q-180,70 -180,50 Z" fill="#ffffff"/>
    <text x="0" y="20" font-family="Georgia,serif" font-style="italic" font-size="18" fill="#026892" text-anchor="middle">"Educar es depositar luz"</text>
    <text x="0" y="50" font-family="Arial" font-size="13" fill="#039ed6" text-anchor="middle">— pensamiento pedagógico cubano</text>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Historia</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
