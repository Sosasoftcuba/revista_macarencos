<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- cuadrícula de fondo (papel de investigación) -->
  <g stroke="#5cb8e0" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>
  <!-- microscopio -->
  <g transform="translate(640,360)">
    <!-- base -->
    <ellipse cx="0" cy="140" rx="100" ry="20" fill="#026892"/>
    <rect x="-80" y="100" width="160" height="40" rx="6" fill="#039ed6"/>
    <!-- brazo -->
    <path d="M-30,100 L-30,0 L30,0 L30,-40 L60,-40 L60,100 Z" fill="#ffffff"/>
    <!-- tubo óptico -->
    <rect x="40" y="-120" width="30" height="100" rx="4" fill="#026892"/>
    <!-- lente ocular -->
    <rect x="35" y="-135" width="40" height="20" rx="4" fill="#039ed6"/>
    <!-- lente objetivo -->
    <circle cx="55" cy="20" r="15" fill="#f4c542" stroke="#026892" stroke-width="2"/>
    <!-- platina -->
    <rect x="-20" y="50" width="100" height="12" fill="#5cb8e0"/>
    <!-- muestra -->
    <rect x="20" y="42" width="20" height="8" fill="#f4c542"/>
  </g>
  <!-- lupa con datos -->
  <g transform="translate(280,260)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f4c542" stroke-width="8"/>
    <circle cx="0" cy="0" r="48" fill="#ffffff" opacity="0.15"/>
    <line x1="40" y1="40" x2="90" y2="90" stroke="#f4c542" stroke-width="10" stroke-linecap="round"/>
    <!-- gráfico dentro de la lupa -->
    <g transform="translate(-25,-20)">
      <rect x="0" y="20" width="8" height="20" fill="#039ed6"/>
      <rect x="12" y="10" width="8" height="30" fill="#039ed6"/>
      <rect x="24" y="0" width="8" height="40" fill="#026892"/>
      <rect x="36" y="15" width="8" height="25" fill="#039ed6"/>
    </g>
  </g>
  <!-- pila de tesis / libros -->
  <g transform="translate(960,420)">
    <rect x="0" y="0" width="140" height="30" rx="2" fill="#f4c542"/>
    <rect x="-10" y="-30" width="140" height="30" rx="2" fill="#ffffff"/>
    <rect x="5" y="-60" width="140" height="30" rx="2" fill="#5cb8e0"/>
    <!-- cinta -->
    <path d="M70,-60 L70,-90 L90,-90 L90,-60" fill="#d63b3b"/>
  </g>
  <!-- bombilla (idea) -->
  <g transform="translate(1060,200)">
    <circle cx="0" cy="0" r="35" fill="#f4c542"/>
    <rect x="-15" y="30" width="30" height="20" fill="#ffffff"/>
    <rect x="-12" y="50" width="24" height="8" fill="#026892"/>
    <!-- rayos -->
    <g stroke="#f4c542" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-55" x2="0" y2="-45"/>
      <line x1="-45" y1="0" x2="-55" y2="0"/>
      <line x1="45" y1="0" x2="55" y2="0"/>
      <line x1="-32" y1="-32" x2="-40" y2="-40"/>
      <line x1="32" y1="-32" x2="40" y2="-40"/>
    </g>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Investigación</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
