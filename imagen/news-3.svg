<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#026892"/>
      <stop offset="1" stop-color="#039ed6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- circuitos de fondo -->
  <g stroke="#5cb8e0" stroke-width="2" fill="none" opacity="0.3">
    <path d="M0,200 L200,200 L200,100 L400,100"/>
    <path d="M1280,300 L1000,300 L1000,150 L800,150"/>
    <path d="M0,500 L300,500 L300,600 L600,600"/>
    <path d="M1280,550 L900,550 L900,650 L700,650"/>
    <circle cx="200" cy="200" r="4" fill="#5cb8e0"/>
    <circle cx="400" cy="100" r="4" fill="#5cb8e0"/>
    <circle cx="1000" cy="300" r="4" fill="#5cb8e0"/>
    <circle cx="300" cy="500" r="4" fill="#5cb8e0"/>
  </g>
  <!-- robot central -->
  <g transform="translate(640,360)">
    <!-- antena -->
    <line x1="0" y1="-150" x2="0" y2="-110" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="-155" r="8" fill="#f4c542"/>
    <!-- cabeza -->
    <rect x="-80" y="-110" width="160" height="120" rx="20" fill="#ffffff"/>
    <!-- pantalla cara -->
    <rect x="-60" y="-90" width="120" height="70" rx="8" fill="#026892"/>
    <!-- ojos -->
    <circle cx="-25" cy="-55" r="12" fill="#039ed6"/>
    <circle cx="25" cy="-55" r="12" fill="#039ed6"/>
    <circle cx="-25" cy="-55" r="5" fill="#ffffff"/>
    <circle cx="25" cy="-55" r="5" fill="#ffffff"/>
    <!-- boca sonriente -->
    <path d="M-20,-25 Q0,-15 20,-25" fill="none" stroke="#039ed6" stroke-width="3" stroke-linecap="round"/>
    <!-- cuerpo -->
    <rect x="-100" y="10" width="200" height="140" rx="15" fill="#ffffff"/>
    <!-- chip en el pecho -->
    <rect x="-30" y="50" width="60" height="60" rx="6" fill="#039ed6"/>
    <g stroke="#ffffff" stroke-width="2">
      <line x1="-30" y1="60" x2="-45" y2="60"/><line x1="-30" y1="80" x2="-45" y2="80"/><line x1="-30" y1="100" x2="-45" y2="100"/>
      <line x1="30" y1="60" x2="45" y2="60"/><line x1="30" y1="80" x2="45" y2="80"/><line x1="30" y1="100" x2="45" y2="100"/>
    </g>
    <circle cx="0" cy="80" r="8" fill="#f4c542"/>
    <!-- brazos -->
    <rect x="-140" y="30" width="35" height="90" rx="15" fill="#ffffff"/>
    <rect x="105" y="30" width="35" height="90" rx="15" fill="#ffffff"/>
    <!-- manos sosteniendo libro -->
    <rect x="-60" y="170" width="120" height="20" fill="#f4c542"/>
  </g>
  <!-- pizarra con fórmula -->
  <g transform="translate(120,200)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#026892" stroke="#ffffff" stroke-width="3"/>
    <text x="90" y="50" font-family="monospace" font-size="20" fill="#f4c542" text-anchor="middle">AI = ∑(aprender)</text>
    <text x="90" y="90" font-family="monospace" font-size="14" fill="#5cb8e0" text-anchor="middle">→ práctica</text>
  </g>
  <!-- libro digital -->
  <g transform="translate(1000,200)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#ffffff"/>
    <rect x="10" y="10" width="140" height="90" rx="4" fill="#e6f5fb"/>
    <g fill="#039ed6">
      <rect x="20" y="20" width="80" height="6"/><rect x="20" y="35" width="100" height="4"/>
      <rect x="20" y="50" width="100" height="4"/><rect x="20" y="65" width="70" height="4"/>
    </g>
    <circle cx="120" cy="85" r="12" fill="#f4c542"/>
    <text x="120" y="90" font-size="14" fill="#026892" text-anchor="middle">▶</text>
  </g>
  <text x="60" y="80" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">Tecnología educativa</text>
  <g opacity="0.9" transform="translate(1080,670)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia,serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">APC</text>
    <text x="30" y="5" font-family="Arial,sans-serif" font-size="11" fill="#ffffff" opacity="0.7">Macarenco</text>
  </g>
</svg>
